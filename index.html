<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation | Formwheel</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e8eafa;background:#101323}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;background:#1b2035;border-bottom:1px solid #343a55}header a{color:#b7aaff;text-decoration:none}.shell{max-width:1300px;margin:auto;padding:18px}.top,.toolbar,.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:12px}button,select,input{font:inherit}button,select,.filebtn{background:#292f4c;border:1px solid #424b70;color:#f6f4ff;border-radius:10px;padding:9px 12px;cursor:pointer}button:hover,.filebtn:hover{background:#414b76}button.active{background:#745fe0;border-color:#a693ff}input[type=color]{height:37px;width:45px;border:0;background:transparent}input[type=number]{width:62px;background:#242a44;border:1px solid #485171;color:white;padding:8px;border-radius:8px}input[type=range]{width:110px}.work{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.stage{background:#20263b;border:1px solid #3a425b;border-radius:17px;padding:14px}.canvasbox{position:relative;width:min(100%,800px);aspect-ratio:16/9;margin:auto;overflow:hidden;background-color:white;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#draw{cursor:crosshair}aside{background:#1d2339;border:1px solid #3c4460;border-radius:17px;padding:14px}aside h3{margin:0 0 10px}.timeline{display:flex;gap:9px;overflow-x:auto;padding:12px 2px}.frame{min-width:110px;text-align:center;padding:8px;background:#242b46;border:2px solid transparent;border-radius:12px;cursor:pointer}.frame.selected{border-color:#ae97ff;background:#39315e}.frame img{display:block;width:90px;aspect-ratio:16/9;object-fit:contain;background:white;margin-bottom:6px}.small{font-size:12px;color:#b8beda}.status{color:#a9f3d7;min-height:20px}.shortcut{font-size:12px;color:#aeb5d1;margin-top:15px}.filebtn input{display:none}@media(max-width:850px){.work{grid-template-columns:1fr}.shell{padding:10px}.toolbar button{padding:8px}aside{order:2}}[hidden]{display:none!important}
</style></head><body><header><strong>🎬 Formwheel <span style="color:#b9a6ff">Animation</span></strong><a href="https://semicolonxss.github.io/Formwheel/">← Hub</a></header><main class="shell"><div class="top"><strong>프레임 애니메이션 스튜디오</strong><span class="small">그리기 → 프레임 추가 → 재생</span></div>
<div class="toolbar" aria-label="그리기 도구"><button data-tool="pen" class="active">✏️ 펜</button><button data-tool="eraser">🧽 지우개</button><button data-tool="line">╱ 직선</button><button data-tool="rect">▭ 사각형</button><button data-tool="ellipse">◯ 원</button><label>색 <input id="color" type="color" value="#27263a"></label><label>굵기 <input id="size" type="range" min="1" max="40" value="5"><span id="sizeOut">5</span></label><button id="undo">↶ 실행 취소</button><button id="clear">🗑 프레임 지우기</button></div>
<div class="work"><section class="stage"><div class="canvasbox"><canvas id="onion" width="800" height="450" aria-hidden="true"></canvas><canvas id="draw" width="800" height="450" aria-label="애니메이션 그리기 영역"></canvas></div><div class="playbar" style="margin-top:13px"><button id="play">▶ 재생</button><button id="stop">■ 정지</button><label>FPS <input type="number" id="fps" value="8" min="1" max="24"></label><label><input type="checkbox" id="skin" checked> 이전 프레임 반투명</label><span id="counter">1 / 1</span></div></section>
<aside><h3>🎞 프레임 관리</h3><div class="playbar"><button id="add">＋ 새 프레임</button><button id="duplicate">⧉ 복제</button><button id="remove">－ 삭제</button></div><div class="playbar"><button id="prev">← 이전</button><button id="next">다음 →</button></div><h3>💾 저장 · 내보내기</h3><div class="playbar"><button id="save">프로젝트 저장</button><label class="filebtn">📂 불러오기<input id="load" type="file" accept=".json,application/json"></label><button id="png">현재 PNG</button><button id="gif">🎞 GIF 저장</button><button id="webm">🎥 WebM 녹화</button></div><p class="small">작업은 이 브라우저에 자동 저장됩니다. 다른 기기로 옮길 때는 프로젝트 JSON 파일을 사용하세요.</p><p id="status" class="status" role="status"></p></aside></div><h3>타임라인 <span class="small">(프레임을 선택해서 편집)</span></h3><div class="timeline" id="timeline"></div><p class="shortcut">💡 Ctrl+Z 실행 취소 · 스페이스바 재생/정지 · ← → 프레임 이동 · 손가락과 마우스 모두 지원</p></main>
<script>
(()=>{'use strict';
const W=800,H=450,$=id=>document.getElementById(id),canvas=$('draw'),ctx=canvas.getContext('2d'),onion=$('onion'),oc=onion.getContext('2d');
const blank=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c.toDataURL('image/png')};
let frames=[blank()],index=0,tool='pen',drawing=false,start=null,base=null,undo=[],playing=false,timer=null,dirty=false,saveTimer;
const stateKey='fw-animation-project-v1',getfps=()=>Math.max(1,Math.min(24,Number($('fps').value)||8));
function message(s){$('status').textContent=s}
function decode(url,callback){const im=new Image();im.onload=()=>callback(im);im.src=url}
function commit(){frames[index]=canvas.toDataURL('image/png');dirty=false;queueSave();renderTimeline()}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(stateKey,JSON.stringify({version:1,width:W,height:H,fps:getfps(),frames}));message('✓ 브라우저에 자동 저장됨')}catch{message('⚠ 자동 저장 공간 부족 · JSON으로 저장하세요')}},500)}
function refresh(){ctx.clearRect(0,0,W,H);oc.clearRect(0,0,W,H);const i=index;decode(frames[i],im=>{if(index===i&&!dirty)ctx.drawImage(im,0,0)});if($('skin').checked&&index>0){decode(frames[index-1],im=>{if(index===i){oc.globalAlpha=.25;oc.drawImage(im,0,0);oc.globalAlpha=1}})}$('counter').textContent=(index+1)+' / '+frames.length;renderTimeline()}
function renderTimeline(){const root=$('timeline');root.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.className='frame'+(i===index?' selected':'');b.type='button';const im=document.createElement('img');im.src=f;im.alt='프레임 '+(i+1);const span=document.createElement('span');span.textContent='프레임 '+(i+1);b.append(im,span);b.onclick=()=>select(i);root.append(b)})}
function select(i){if(playing||i<0||i>=frames.length)return;if(dirty)commit();index=i;undo=[];dirty=false;refresh()}
function snapshot(){undo.push(canvas.toDataURL());if(undo.length>20)undo.shift()}
function pointer(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function style(){ctx.lineWidth=Number($('size').value);ctx.strokeStyle=$('color').value;ctx.fillStyle=$('color').value;ctx.lineJoin='round';ctx.lineCap='round';ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'}
function drawShape(a,b){ctx.beginPath();if(tool==='line'){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}else if(tool==='rect'){ctx.rect(a.x,a.y,b.x-a.x,b.y-a.y)}else if(tool==='ellipse'){ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(.01,Math.abs(b.x-a.x)/2),Math.max(.01,Math.abs(b.y-a.y)/2),0,0,Math.PI*2)}ctx.stroke()}
canvas.addEventListener('pointerdown',e=>{if(playing)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;start=pointer(e);snapshot();style();if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(start.x+.01,start.y+.01);ctx.stroke()}else base=ctx.getImageData(0,0,W,H);dirty=true});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pointer(e);if(tool==='pen'||tool==='eraser'){style();ctx.lineTo(p.x,p.y);ctx.stroke()}else{ctx.putImageData(base,0,0);style();drawShape(start,p)}});
function finish(e){if(!drawing)return;drawing=false;ctx.globalCompositeOperation='source-over';commit()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
$('size').oninput=()=>$('sizeOut').textContent=$('size').value;
$('skin').onchange=refresh;$('fps').onchange=queueSave;
$('undo').onclick=()=>{if(playing||!undo.length)return;const old=undo.pop();decode(old,im=>{ctx.clearRect(0,0,W,H);ctx.drawImage(im,0,0);commit()})};
$('clear').onclick=()=>{if(playing)return;snapshot();ctx.clearRect(0,0,W,H);commit()};
$('add').onclick=()=>{if(playing)return;frames.splice(index+1,0,blank());select(index+1)};
$('duplicate').onclick=()=>{if(playing)return;frames.splice(index+1,0,frames[index]);select(index+1)};
$('remove').onclick=()=>{if(playing)return;if(frames.length===1){$('clear').click();return}frames.splice(index,1);index=Math.min(index,frames.length-1);undo=[];refresh();queueSave()};
$('prev').onclick=()=>select(index-1);$('next').onclick=()=>select(index+1);
function stop(){playing=false;clearInterval(timer);timer=null;$('play').textContent='▶ 재생';refresh()}
function play(){if(playing){stop();return}playing=true;$('play').textContent='⏸ 일시정지';let step=index;const tick=()=>{ctx.clearRect(0,0,W,H);oc.clearRect(0,0,W,H);decode(frames[step],im=>{if(playing)ctx.drawImage(im,0,0)});index=step;$('counter').textContent=(step+1)+' / '+frames.length;step=(step+1)%frames.length};tick();timer=setInterval(tick,1000/getfps())}
$('play').onclick=play;$('stop').onclick=stop;
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('png').onclick=()=>canvas.toBlob(b=>{if(b)download(b,'formwheel-frame.png')},'image/png');
$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,width:W,height:H,fps:getfps(),frames})],{type:'application/json'}),'formwheel-animation.json');
$('load').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>25e6)throw Error('파일이 너무 큽니다');const d=JSON.parse(await f.text());if(d.version!==1||d.width!==W||d.height!==H||!Array.isArray(d.frames)||!d.frames.length||d.frames.length>400||d.frames.some(x=>typeof x!=='string'||!x.startsWith('data:image/png;base64,')))throw Error('지원하지 않는 프로젝트 형식입니다');stop();frames=d.frames;index=0;$('fps').value=d.fps||8;undo=[];refresh();queueSave();message('✓ 프로젝트 불러옴')}catch(err){message('⚠ '+err.message)}e.target.value=''};
$('gif').onclick=async()=>{message('GIF를 준비하고 있어요…');try{const mod=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm');const gif=mod.GIFEncoder(),quantize=mod.quantize,applyPalette=mod.applyPalette;for(const frame of frames){const im=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=frame});const tmp=document.createElement('canvas');tmp.width=400;tmp.height=225;const tc=tmp.getContext('2d');tc.fillStyle='#fff';tc.fillRect(0,0,400,225);tc.drawImage(im,0,0,400,225);const rgba=tc.getImageData(0,0,400,225).data,palette=quantize(rgba,256);gif.writeFrame(applyPalette(rgba,palette),400,225,{palette,delay:Math.round(1000/getfps())})}gif.finish();download(new Blob([gif.bytes()],{type:'image/gif'}),'formwheel-animation.gif');message('✓ GIF 저장 완료')}catch(e){message('GIF 생성 실패 · 네트워크 연결을 확인하세요');}};
$('webm').onclick=async()=>{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){message('이 브라우저는 영상 녹화를 지원하지 않아요');return}if(playing)stop();const c=document.createElement('canvas');c.width=W;c.height=H;const cc=c.getContext('2d'),stream=c.captureStream(0),track=stream.getVideoTracks()[0],types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mime){message('WebM 녹화를 지원하지 않는 브라우저입니다');return}const rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{download(new Blob(chunks,{type:mime}),'formwheel-animation.webm');stream.getTracks().forEach(t=>t.stop());message('✓ 영상 저장 완료')};rec.start();message('영상 녹화 중…');const delay=1000/getfps();for(const frame of frames){const im=await new Promise(resolve=>{const x=new Image();x.onload=()=>resolve(x);x.src=frame});cc.fillStyle='#fff';cc.fillRect(0,0,W,H);cc.drawImage(im,0,0);track.requestFrame?.();await new Promise(resolve=>setTimeout(resolve,delay))}await new Promise(resolve=>setTimeout(resolve,250));rec.stop()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}else if(e.code==='Space'){e.preventDefault();$('play').click()}else if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='ArrowRight')$('next').click()});
try{const saved=JSON.parse(localStorage.getItem(stateKey));if(saved?.version===1&&Array.isArray(saved.frames)&&saved.frames.length&&saved.frames.every(x=>typeof x==='string'&&x.startsWith('data:image/png;base64,'))){frames=saved.frames;$('fps').value=saved.fps||8;message('✓ 이전 작업 복원')}}catch{}refresh();
})();
</script></body></html>
